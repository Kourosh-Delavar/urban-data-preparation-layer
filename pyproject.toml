[build-system]
requires = ["setuptools>68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-data-preparation-layer"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "python-dotenv>=1.2.2",
    "pyspark==3.4.1",          
    "apache-sedona==1.5.1",     
    "pandas>=1.0.0",
    "geopandas>=1.1.3",
    "s3fs>=2024.4.0",           
]

[tool.setuptools.packages.find]
where = ["src", "."]